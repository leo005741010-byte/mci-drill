<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1a4a7a">
<title>大量傷患演習</title>
<style>
:root{--navy:#1a4a7a;--navy-dark:#12355a;--bg:#f3f6fa;--card:#fff;--line:#dfe6ee;--txt:#1f2d3d;--mut:#6b7a8c;
  --ok:#1f8a4c;--okbg:#e6f5ec;--warn:#a85800;--warnbg:#fff4e0;--bad:#c0392b;--badbg:#fdecea;
  --z-red:#c0392b;--z-yellow:#f2c230;--z-green:#1f8a4c;--z-black:#22272e}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:16px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header.top .wrap{padding-top:11px;padding-bottom:11px}
header.top h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.5px}
main.wrap{padding-top:14px;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
h2{font-size:15px;color:var(--mut);font-weight:700;margin:18px 2px 8px}
.mut{color:var(--mut);font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.back{background:none;border:none;color:var(--navy);font-size:15px;padding:4px 2px;margin-bottom:8px}

/* 數字磚 */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.tile .k{font-size:13.5px;color:var(--mut)}
.tile .n{font-size:24px;font-weight:700;color:var(--navy-dark);line-height:1.2}
.tile .n small{font-size:14px;font-weight:400;color:var(--mut)}
.tile.big .n{font-size:38px}
.tile.bad .n{color:var(--bad)}.tile.good .n{color:var(--ok)}
.tile .h{font-size:12px;color:var(--mut)}

/* 首頁三個入口 */
.mode{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--navy);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.mode b{display:block;font-size:18px;color:var(--navy-dark)}
.mode span{font-size:13.5px;color:var(--mut)}

/* 選關卡、選角色 */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-size:15px}
.chip i{font-style:normal;font-size:12px;color:var(--mut);margin-left:6px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}.chip.on i{color:#cfe0f2}
.rolegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rolebtn{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;text-align:left}
.rolebtn b{display:block;font-size:16.5px;color:var(--navy-dark)}
.rolebtn span{font-size:12.5px;color:var(--mut)}
.rolebtn.done{border-color:#bfe3cd;background:#fafdfb}.rolebtn.done span{color:var(--ok)}
.rolebtn.rand{grid-column:1/-1;background:var(--navy);border-color:var(--navy)}.rolebtn.rand b,.rolebtn.rand span{color:#fff}

/* 情境簡報 */
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tag{display:inline-block;font-size:12.5px;border-radius:999px;padding:2px 10px;background:#eef2f7;color:var(--mut)}
.tag.navy{background:var(--navy);color:#fff}.tag.warn{background:var(--warnbg);color:var(--warn)}
.story{margin:0;font-size:16.5px}
.rolename{font-size:28px;font-weight:700;color:var(--navy-dark);line-height:1.3}
.k{font-size:13.5px;color:var(--mut)}

/* 按鈕 */
.btn{border-radius:12px;padding:13px 18px;font-size:16.5px;font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.block{display:block;width:100%;margin-top:10px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}

/* 作答 */
.playtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:12px}
.phases span{text-align:center;font-size:12.5px;padding:5px 0;border-radius:8px;background:#e6ecf3;color:var(--mut)}
.phases span.past{background:#cfdcea;color:var(--navy)}
.phases span.on{background:var(--navy);color:#fff;font-weight:700}
.card.q .tag{margin-bottom:6px}
.stem{margin:0;font-size:18px;font-weight:700;line-height:1.5}
.opts{display:grid;gap:8px}
.opt{width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;line-height:1.45}
.opt:disabled{cursor:default;color:var(--txt)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.miss{border-color:var(--bad);background:var(--badbg)}
.opt.dim{opacity:.5}
.fb{border-radius:12px;padding:12px 14px;margin-top:12px}
.fb b{font-size:16px}.fb p{margin:4px 0 0}
.fb.good{background:var(--okbg);color:#14532d}
.fb.bad{background:var(--badbg);color:#7a1f16}
.fb .should{margin-top:10px;padding-top:8px;border-top:1px dashed rgba(122,31,22,.3);color:var(--txt)}
.fb .should span{display:block;font-size:12.5px;color:var(--mut)}

/* 收合卡片 */
details.card{padding:0}
details.card>summary{list-style:none;padding:13px 16px;font-weight:700;color:var(--navy-dark);display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"＋";color:var(--mut);font-weight:400}
details.card[open]>summary::after{content:"－"}
details.card>summary small{font-weight:400;color:var(--mut);font-size:12.5px;margin-left:auto}
details.card>.in{padding:0 16px 14px;border-top:1px solid var(--line)}
.in h4{margin:12px 0 2px;font-size:13.5px;color:var(--navy)}
.in h4.trap{color:var(--bad)}
.in ul{margin:0;padding-left:20px}.in li{margin:2px 0}
.rev{padding:10px 0;border-bottom:1px solid var(--line)}.rev:last-child{border-bottom:none}
.rev .s{font-weight:700}
.rev .a{margin-top:3px}.rev .a.ok{color:var(--ok)}.rev .a.no{color:var(--bad)}
.rev .c{margin-top:3px;font-size:14.5px}

/* 指揮架構 */
.ics{text-align:center}
.ics .boss{display:inline-block;background:var(--navy);color:#fff;font-weight:700;border-radius:10px;padding:8px 22px}
.ics .stem2{width:2px;height:14px;background:var(--line);margin:0 auto}
.ics .grp{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}
.ics .g{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.ics .g b{display:block;font-size:13px;color:var(--navy)}
.ics .g span{display:block;font-size:15px}

/* 檢傷小遊戲 */
.tbar{height:8px;background:#e6ecf3;border-radius:999px;overflow:hidden;margin-bottom:12px}
.tbar i{display:block;height:100%;background:var(--navy);transition:width .2s linear}
.card.pt{border-width:3px;position:relative;min-height:214px}
.card.pt.flash-ok{border-color:var(--ok);background:var(--okbg)}
.card.pt.flash-bad{border-color:var(--bad);background:var(--badbg)}
.pthead{font-size:17px;font-weight:700;margin-bottom:8px}
.pt dl{display:grid;grid-template-columns:52px 1fr;gap:6px 10px;margin:0}
.pt dt{color:var(--mut);font-size:14px;padding-top:2px}.pt dd{margin:0;font-size:17.5px;font-weight:700}
.flashmsg{position:absolute;right:14px;top:10px;font-weight:700;font-size:16px}
.flash-ok .flashmsg{color:var(--ok)}.flash-bad .flashmsg{color:var(--bad)}
.zbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.zbtn{border:none;border-radius:14px;padding:20px 0;font-size:21px;font-weight:700;color:#fff}
.zbtn:disabled{opacity:.55}
.z-red{background:var(--z-red)}.z-yellow{background:var(--z-yellow);color:#3a2e00}.z-green{background:var(--z-green)}.z-black{background:var(--z-black)}
.zdot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
ol.rule{margin:8px 0 0;padding-left:22px}ol.rule li{margin:3px 0}
.foot{color:var(--mut);font-size:12.5px;text-align:center;margin-top:22px;line-height:1.7}
@media(min-width:560px){.rolegrid{grid-template-columns:repeat(3,1fr)}.ics .grp{grid-template-columns:repeat(4,1fr)}}

/* 演習資訊卡、職類分組、任務卡 */
.dtitle{font-size:19px;font-weight:700;color:var(--navy-dark);margin:2px 0 10px}
.sev{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.sv{border-radius:12px;padding:8px 0;text-align:center;color:#fff}
.sv b{display:block;font-size:30px;line-height:1.15}.sv span{font-size:13.5px}
.sv.red{background:var(--z-red)}.sv.yellow{background:var(--z-yellow);color:#3a2e00}.sv.green{background:var(--z-green)}
h3{font-size:13px;color:var(--navy);margin:12px 2px 6px;font-weight:700}
.rolegrid.one{grid-template-columns:1fr}
dl.kv{display:grid;grid-template-columns:76px 1fr;gap:6px 10px;margin:8px 0 0}
dl.kv dt{color:var(--mut);font-size:13.5px;padding-top:1px}dl.kv dd{margin:0;font-weight:700}
.in dl.kv{margin-top:12px}
.center{text-align:center;margin:8px 0 12px}
.tasks h4{margin:12px 0 2px;font-size:13.5px;color:var(--navy)}.tasks h4:first-child{margin-top:0}
.tasks h4.trap{color:var(--bad)}.tasks ul{margin:0;padding-left:20px}.tasks li{margin:2px 0}
.ics .boss.alt{background:#fff;color:var(--navy);border:2px solid var(--navy)}
/* 第三版：規範重點 */
.lvline{font-size:15px;margin:2px 0 4px}.lvline b{color:var(--bad)}
.ics .staff{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.ics .staff span{border:1.5px solid var(--navy);color:var(--navy);border-radius:999px;padding:3px 12px;font-size:14px}
.ics .g span{font-size:14px;line-height:1.5;margin:2px 0}
table.lvt{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
table.lvt th,table.lvt td{border:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
table.lvt th{background:#eef2f7;color:var(--mut);font-weight:700}
table.lvt tr.cur td{background:var(--warnbg);font-weight:700}
dl.kv dd.ref{font-weight:400;color:var(--mut);font-size:13.5px}
.pno{display:inline-block;background:var(--navy);color:#fff;border-radius:6px;padding:0 8px;margin-right:8px;font-size:15px}
.fb .should .why{display:inline;font-size:14px;color:var(--mut)}
.in li .zdot{vertical-align:-1px}
</style>
</head>
<body>
<header class="top"><div class="wrap"><h1>大量傷患演習</h1></div></header>
<main class="wrap" id="app"></main>
<script>
'use strict';
const VERSION='v3';
// 這次演習的設定。任務卡與題目裡的人數是照這組數字寫的，改這裡時要一起改。
const DRILL={y:2026,m:10,d:28,when:'上午',what:'國道車禍',red:2,yellow:2,green:15};
const DRILL_N=DRILL.red+DRILL.yellow+DRILL.green;

/* ───────── 院內規範：大量傷患緊急處理作業規範（第 18 版） ───────── */
const SOP_NAME='大量傷患緊急處理作業規範（第 18 版）';
// 3.3 動員級數（召回原則）
const LEVELS=[
 {name:'四級',range:'少於 4 人',who:'不召回，依樹狀通知圖向上回報',time:'—'},
 {name:'三級',range:'4–10 人',who:'既有線上人員、主管級人員、行政中心主管',time:'立即到位'},
 {name:'二級',range:'11–14 人',who:'視需要啟動緊急召回（總機發簡訊）',time:'30 分鐘內'},
 {name:'一級',range:'15 人以上',who:'視需要啟動緊急召回（總機發簡訊）',time:'1 小時內'}];
const levelOf=n=>n<4?LEVELS[0]:n<=10?LEVELS[1]:n<=14?LEVELS[2]:LEVELS[3];
const LV=levelOf(DRILL_N);                          // 這次 19 人＝一級
const BC_PREP='「急診室333'+LV.name+'預備」', BC_GO='「急診室333'+LV.name+'開始」';
// 5.3.4 環境分區＋附件四 分類標準
const ZONE={
 red:{c:'紅區',sev:'重度',area:'立即治療區',bed:'急診急救區',rule:'傷病危急，呼吸大於 30 次/分，不立即處理會危及生命'},
 yellow:{c:'黃區',sev:'中度',area:'延遲治療區',bed:'急診第 5–10 床',rule:'重傷但不會立即危及生命，呼吸小於 30 次/分，相當痛苦'},
 green:{c:'綠區',sev:'輕度',area:'簡易治療區',bed:'急診第 1–3 床',rule:'輕傷，可以自己走進急診'},
 black:{c:'黑區',sev:'死亡',area:'期待治療區',bed:'急診第 22 床',rule:'沒有呼吸，已死亡'}};
const OLD_PT_BED='急診第 11–17 床（放不下時安排 C 棟二樓）';

const TRIAGE_SECONDS=60, TRIAGE_N=10;
const LS_KEY='mciDrill_v2';      // 只存個人最佳紀錄，不上雲端（沿用第二版的鍵，舊紀錄不會不見）
const PHASES=['333 預備','333 開始','回報與結案'];
const ZONES={red:'紅區',yellow:'黃區',green:'綠區',black:'黑區'};
// 答錯的類型：role＝做了別人的事、report＝該報沒報或找錯人、delay＝拖到了、wrong＝做法不對
const TAGS={role:'出戲',report:'漏回報／越級',delay:'延誤',wrong:'判斷錯誤'};
const TAG_HINT={role:'做了別人的事',report:'該報沒報，或找錯人',delay:'該做的事拖到了',wrong:'做法不對'};

/* ───────── 各位置：任務卡＋題目 ─────────
   grp＝規範的組別；site:'er' 人會到急診、'dept' 留在自己單位；ref＝規範條文。
   q 的每一題：p＝時段(0/1/2)、s＝題目、o＝選項 [文字, 類型, 後果]，第一個選項固定是正解（出題時會打亂順序）。 */
const ROLES=[
/* ── 指揮系統 ── */
{id:'ic',name:'指揮官',grp:'指揮系統',site:'er',ref:'5.2、5.3.1、5.3.2、5.5.1.1',
 who:'第一時間由急診當班醫師擔任；院長到達時交接指揮權',to:'院長到達後向院長報告、交接',
 go:'留在急診，站到固定的指揮位置',num:'預計 19 人 → 333 一級動員',
 tasks:[['評估並啟動 333，定動員級數（這次 19 人＝一級）','請當班檢傷廣播'+BC_PREP+' 2 次','自己或請當班護理組長到急診室護理長辦公室，取出各組任務箱放在門口'],
        ['站在固定位置指揮，不下去做處置','各區組長每 10 分鐘向你回報','人力、床位、手術、轉院由你決定'],
        ['院長到達時報告現況、交接指揮權','決定何時解除，通知結報']],
 traps:['自己下去做處置，沒人指揮','任務箱沒拿出來，各組不知道要做什麼','交接只說「都安排好了」'],
 q:[
 {p:0,s:'119 通報國道車禍，預計送本院 19 人。你是急診當班醫師，第一步？',o:[
  ['啟動 333 一級並擔任指揮官，請檢傷廣播'+BC_PREP,'ok','規範：由急診醫師評估啟動 333 並擔任指揮官，院長到達時再交接。'],
  ['先把手上這床病人看完','delay','第一輛救護車到的時候，還沒有人分區，傷患全部擠在門口。'],
  ['自己到門口等救護車，準備檢傷','role','檢傷是檢傷分類組的事。你站在門口，沒有人在指揮。'],
  ['先打電話請示院長，等回覆再啟動','delay','規範由急診醫師評估啟動，不用等院長；院長到了再交接。']]},
 {p:0,s:'啟動後，各組怎麼知道自己要做什麼？',o:[
  ['到急診室護理長辦公室取出各組任務箱，放在門口，由組長把任務卡發給小組長','ok','規範 5.3.2、5.5：各組照任務卡動起來。'],
  ['一個一個口頭交代','delay','交代到第三個人，傷患已經到了。'],
  ['各組自己知道，不用管','wrong','沒有任務卡，各組各做各的。'],
  ['等院長到了再分配','delay','院長到之前沒有人知道自己的任務。']]},
 {p:1,s:'紅區有一位要插管，紅區的人正在處理別床，喊你過去幫忙。',o:[
  ['請醫療人力組調一位醫師過去，自己留在指揮位置','ok','病人有人處理，你也還掌握全場。'],
  ['自己過去插管，兩分鐘就好','role','你離開的 5 分鐘，又有傷患到院，沒有人調度，各區都在找指揮官。'],
  ['叫檢傷的人先進來幫忙','wrong','檢傷一離開，入口立刻塞住，沒分類的人直接走進來。'],
  ['請他先撐一下','delay','紅區已經開口要人，沒有回應就等於沒有指揮。']]},
 {p:1,s:'你要知道現在到了幾人、各區各幾人。問誰？',o:[
  ['計畫組的傷患狀況組（書記組）','ok','人數和去向只有一個來源，對外的數字才會一致。'],
  ['自己去各區數一遍','role','你離開了指揮位置，而且數完的時候數字已經變了。'],
  ['檢傷分類組','wrong','檢傷知道進門幾人，但不知道誰換區、誰已送走；他一停下來入口就塞住。'],
  ['紅區組長','wrong','他只知道紅區。']]},
 {p:2,s:'紅區回報：急救區都在用，黃區又有一位惡化要升級。',o:[
  ['找出口：請聯絡官聯絡開刀房、加護病房和轉院，把穩定的先送出去','ok','紅區騰出床，升級的人接得住。'],
  ['請黃區先不要升級','wrong','分級看的是傷情，不是床位。該進紅區的留在黃區，只會更糟。'],
  ['自己進紅區幫忙','role','床位問題沒解決，全場又沒人指揮。'],
  ['讓紅區自己想辦法','delay','床位、轉院、人力要你來調，紅區調不動別的單位。']]},
 {p:2,s:'院長到院，要接手指揮。交接時最該報什麼？',o:[
  ['已到與在途人數、各區人數與床位、各組組長是誰、現在缺什麼','ok','院長 1 分鐘內就能接手，不用再問一輪。'],

const $app=document.getElementById('app');
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function load(){try{const o=JSON.parse(localStorage.getItem(LS_KEY)||'{}');return {units:o.units||{},triage:o.triage||null};}catch(e){return {units:{},triage:null};}}
function save(st){try{localStorage.setItem(LS_KEY,JSON.stringify(st));}catch(e){}}

/* ───────── 走一遍：組一局 ─────────
   共同題＋這個位置自己的題目＋兩張突發狀況（「333 開始」、「回報與結案」各一張）。 */
const EVENTS_PER_ROUND=2;
function eventQuestion(e,role,p){
  if(e.o) return {kind:'event',p,s:e.s,o:e.o};
  const owner=ROLE(e.owner), w=e.wrong.find(x=>x[0]!==role.id);
  return {kind:'event',p,s:e.s,o:[
    [e.okT||('通知「'+owner.name+'」，然後回到自己的崗位'),'ok',e.ok],
    ['通知「'+ROLE(w[0]).name+'」，然後回到自己的崗位','report',w[1]],
    [e.selfT,'role',e.self],
    [e.ignT,'report',e.ign]]};
}
function buildRound(role){
  const can=EVENTS.filter(e=>(e.site||['er']).includes(role.site)&&!e.skip.includes(role.id));
  const evs=shuffle(can).slice(0,EVENTS_PER_ROUND).map((e,i)=>eventQuestion(e,role,i+1));
  const qs=[];
  for(let p=0;p<3;p++){
    const rq=role.q.filter(q=>q.p===p).map(q=>Object.assign({kind:'role'},q));
    const ev=evs.filter(e=>e.p===p);
    const part=COMMON.filter(k=>k.p===p).map(k=>Object.assign({},k));
    rq.forEach((q,i)=>{part.push(q);if(i===0)part.push(...ev);});
    if(!rq.length)part.push(...ev);
    qs.push(...part);
  }
  qs.forEach(q=>{q.oo=shuffle(q.o.map((_,i)=>i));});
  return {role,qs};
}

/* ───────── 檢傷練習：院內「大量傷患分類標準表」（附件四），傷病危急的細節參考 START ───────── */
function startRule(p){
  if(p.walk) return ['green','可以自己走 → 綠區（輕度）'];
  if(p.resp===0) return p.reopen?['red','沒有呼吸，開呼吸道後恢復 → 紅區（重度）']:['black','開呼吸道後仍沒有呼吸 → 黑區（死亡）'];
  if(p.resp>30) return ['red','呼吸大於 30 次/分 → 紅區（重度）'];
  if(!p.radial||p.crt>2) return ['red','橈動脈摸不到或回填超過 2 秒，傷病危急 → 紅區（重度）'];
  if(!p.obey) return ['red','不能照指令做，傷病危急 → 紅區（重度）'];
  return ['yellow','不能走，呼吸小於 30 次/分，循環、意識都過關 → 黃區（中度）'];
}
const INJ={green:['前臂撕裂傷','額頭擦傷','手腕扭傷','多處擦傷','腳踝扭傷','耳鳴、受到驚嚇'],
  yellow:['小腿變形','骨盆疼痛','大腿撕裂傷，已加壓止血','背痛不敢動','腹部瘀青疼痛','前臂開放性骨折'],
  sev:['胸部挫傷','頭部外傷','腹部穿刺傷','大腿大量出血','臉部燒傷','全身多處外傷']};
function makePatient(want){
  const p={walk:false,resp:rnd(14,28),reopen:false,radial:true,crt:rnd(1,2),obey:true};
  let inj;
  if(want==='green'){p.walk=true;inj=pick(INJ.green);}
  else if(want==='yellow'){inj=pick(INJ.yellow);}
  else if(want==='black'){p.resp=0;inj=pick(INJ.sev);}
  else{
    inj=pick(INJ.sev);
    const v=pick(['reopen','fast','circ','mind']);
    if(v==='reopen'){p.resp=0;p.reopen=true;}
    else if(v==='fast'){p.resp=rnd(32,40);}
    else if(v==='circ'){if(Math.random()<.5){p.radial=false;p.crt=rnd(3,5);}else p.crt=rnd(3,4);}
    else p.obey=false;
  }
  p.desc=rnd(8,82)+' 歲'+pick(['男','女'])+'・'+inj;
  const r=startRule(p);p.cat=r[0];p.why=r[1];
  return p;
}
function genPatients(){
  const bag=['green','green','green','yellow','yellow','yellow','red','red','red','black'];
  const cats=['green','yellow','red','black'];
  while(cats.length<TRIAGE_N) cats.push(pick(bag));
  return shuffle(cats).map(makePatient).map((p,i)=>Object.assign(p,{no:'333-'+String(i+1).padStart(2,'0')}));
}

function startRound(unitId){
  S.round=buildRound(ROLE(unitId));S.qi=0;S.picked=null;S.log=[];go('play');
}
function finishRound(){
  const R=S.round, tags={role:0,report:0,delay:0,wrong:0};let right=0;
  S.log.forEach(x=>{const t=x.q.o[x.pick][1];if(t==='ok')right++;else tags[t]++;});
  const total=R.qs.length, score=Math.round(right/total*100);
  const st=load(), old=st.units[R.role.id]||{best:0,plays:0};
  const isBest=score>old.best||!old.plays;
  st.units[R.role.id]={best:Math.max(old.best,score),plays:old.plays+1};save(st);
  S.last={right,total,score,tags,isBest,best:st.units[R.role.id].best,plays:old.plays+1};
  go('result');
}
function triStart(){
  S.tri={list:genPatients(),i:0,ans:[],t0:Date.now(),left:TRIAGE_SECONDS,flash:null,res:null};
  go('triRun');timer=setInterval(triTick,200);
}
function triTick(){
  const T=S.tri;if(!T||S.view!=='triRun')return;
  T.left=TRIAGE_SECONDS-(Date.now()-T.t0)/1000;
  if(T.left<=0){T.left=0;triFinish();return;}
  const b=document.getElementById('tbar'), l=document.getElementById('tleft');
  if(b)b.style.width=(T.left/TRIAGE_SECONDS*100)+'%';
  if(l)l.textContent=Math.ceil(T.left)+' 秒';
}
function triAnswer(z){
  const T=S.tri;if(!T||T.flash||S.view!=='triRun')return;
  const p=T.list[T.i];T.ans.push(z);T.flash={ok:z===p.cat,cat:p.cat};render();
  setTimeout(()=>{if(S.tri!==T||S.view!=='triRun')return;T.flash=null;T.i++;if(T.i>=T.list.length)triFinish();else render();},450);
}
function triFinish(){
  const T=S.tri, r={right:0,over:0,under:0,none:0};
  T.list.forEach((p,i)=>{const j=triJudge(T.ans[i],p.cat);if(j==='ok')r.right++;else r[j]++;});
  r.used=Math.min(TRIAGE_SECONDS,Math.round((Date.now()-T.t0)/1000));
  const st=load(), old=st.triage;
  r.isBest=!old||r.right>old.best||(r.right===old.best&&r.used<old.time);
  st.triage={best:r.isBest?r.right:old.best,time:r.isBest?r.used:old.time,plays:(old?old.plays:0)+1};save(st);
  r.best=st.triage.best;T.res=r;go('triResult');
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act, v=b.dataset.v;
  if(a==='go')go(v);
  else if(a==='job'){S.job=v;const j=JOB(v);if(j.units.length===1){S.unit=j.units[0];go('unit');}else go('job');}
  else if(a==='unit'){S.unit=v;go('unit');}
  else if(a==='walk')startRound(S.unit);
  else if(a==='answer'){if(S.picked!==null)return;S.picked=+v;S.log.push({q:S.round.qs[S.qi],pick:+v});render();}
  else if(a==='next'){S.picked=null;S.qi++;if(S.qi>=S.round.qs.length)finishRound();else{render();window.scrollTo(0,0);}}
  else if(a==='again')startRound(S.round.role.id);
  else if(a==='tristart')triStart();
  else if(a==='tri')triAnswer(v);
});
render();
</script>
